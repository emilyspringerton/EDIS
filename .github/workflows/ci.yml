name: EDIS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: edis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go_dis:
    name: Go — Digital Immune System (internal/dis, cmd/dis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  php_lint:
    name: PHP syntax check — plugins/ + themes/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # No PHPUnit suite exists yet (see CLAUDE.md's "Testing" section — it
    # documents the intended per-plugin composer/phpunit setup, not
    # something built here). This job is a real, if narrower, gate: every
    # .php file must at least parse, which is exactly the class of bug
    # (an unescaped apostrophe breaking a string literal) found and fixed
    # in themes/goblindragon/index.php while writing this workflow.
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: php -l across every plugin/theme file
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r f; do
            if ! php -l "$f" >/tmp/lint-out 2>&1; then
              echo "::error file=$f::$(cat /tmp/lint-out)"
              status=1
            fi
          done < <(find plugins themes -iname "*.php")
          exit "$status"

  construct:
    name: 🏗️ Generate Source Construct
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Real gap closed 2026-08-25 (S202-19): every other active repo with real CI
    # already had a *_CONSTRUCT.txt build artifact (a full concatenation of its
    # own source, matching emily.cli's own ci.yml "Generate Construct Bundle"
    # step) — EDIS was one of 9 confirmed missing it (S202-18's audit).
    steps:
      - uses: actions/checkout@v4
      - name: Generate Construct Bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="EDIS_CONSTRUCT.txt"
          {
            echo "EDIS CONSTRUCT ${{ github.run_number }}"
            echo "commit: $GITHUB_SHA"
            echo "generated_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
          } > "$OUT"

          while IFS= read -r relpath; do
            {
              echo "--- FILE START: ${relpath} ---"
              cat "${relpath}"
              echo
              echo "--- FILE END: ${relpath} ---"
              echo
            } >> "$OUT"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path './vendor' \
                -o -path './node_modules' \
                -o -path './dist' \
                -o -path './build' \
              \) -prune -o \
              -type f \
              \( \
                -name '*.php' -o -name '*.go' -o -name '*.mod' -o -name '*.sum' -o \
                -name '*.js' -o -name '*.css' -o -name '*.md' -o -name '*.sh' -o \
                -name '*.yaml' -o -name '*.yml' -o -name '*.json' \
              \) \
              ! -name "$OUT" \
              -print | sed 's#^./##' | LC_ALL=C sort
          )

          test -s "$OUT"

      - name: Upload Construct Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDIS_Construct_${{ github.run_number }}_${{ github.sha }}
          path: EDIS_CONSTRUCT.txt
          if-no-files-found: error
